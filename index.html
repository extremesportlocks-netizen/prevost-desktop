<div><label style={{fontSize:11,color:GRAY,display:"block",marginBottom:5}}>PASSWORD</label><input id="ap" style={inputS} type="password" placeholder="••••••••"/></div>
<button className="btn-gold" style={{width:"100%",marginTop:6}} onClick={()=>{
const name=document.getElementById("an")?.value||"Demo User";
const email=document.getElementById("ae")?.value||"demo@example.com";
setUser({name,email,role:authMode==="signup"?authRole:"both",odId:authRole==="seller"?"s1":"b_demo",paid:false});nav("home");
}}>{authMode==="login"?"Sign In":"Create Account"}</button>
<div style={{textAlign:"center",marginTop:8,fontSize:13,color:GRAY}}>
{authMode==="login"?<>New here? <span style={{color:GOLD,cursor:"pointer"}} onClick={()=>setAuthMode("signup")}>Create account</span></>:<>Have an account? <span style={{color:GOLD,cursor:"pointer"}} onClick={()=>setAuthMode("login")}>Sign in</span></>}
</div></div></div></div>}

{pg==="sell"&&<div className="fade-in">
{!user?<W style={{paddingTop:80,textAlign:"center"}}><h2 style={{fontSize:28,fontWeight:700,marginBottom:10}}>List Your Coach — Free</h2><p style={{color:GRAY,marginBottom:24}}>Create a free account to get started.</p><button className="btn-gold" onClick={()=>nav("auth",()=>{setAuthMode("signup");setAuthRole("seller");})}>Create Free Account</button></W>
:<W style={{paddingTop:48,paddingBottom:80}}>
<div style={{maxWidth:720,margin:"0 auto"}}>
<div className="section-label">SELLERS</div>
<h2 style={{fontFamily:"'Playfair Display',serif",fontSize:34,fontWeight:700,marginBottom:8}}>List Your Coach — Free</h2>
<p style={{color:GRAY,fontSize:14,marginBottom:10}}>Free until your first buyer contacts you. Then $500 once — never again.</p>
<div style={{padding:"12px 16px",background:"rgba(196,149,106,.04)",borderRadius:8,border:"1px solid rgba(196,149,106,.08)",marginBottom:28,fontSize:13,color:CREAM,display:"flex",alignItems:"center",gap:10}}><Ico name="bell" size={16} color={GOLD}/> <span>One-time <strong style={{color:GOLD}}>$500</strong> when your first buyer reaches out.</span></div>
<div style={{display:"flex",flexDirection:"column",gap:16}}>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
<div><label style={{fontSize:11,color:GRAY,display:"block",marginBottom:5}}>YEAR</label><input style={inputS} placeholder="2024"/></div>
<div><label style={{fontSize:11,color:GRAY,display:"block",marginBottom:5}}>MODEL</label><select style={selectS}><option>H3-45</option><option>X3-45</option></select></div>
<div><label style={{fontSize:11,color:GRAY,display:"block",marginBottom:5}}>CONVERTER</label><select style={selectS}><option value="">Select...</option>{["Marathon","Liberty","Millennium","Emerald","Epic","Featherlite","Loki","Nashville Coach"].map(c=><option key={c}>{c}</option>)}</select></div>
</div>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
<div><label style={{fontSize:11,color:GRAY,display:"block",marginBottom:5}}>ASKING PRICE</label><input style={inputS} placeholder="$1,500,000"/></div>
<div><label style={{fontSize:11,color:GRAY,display:"block",marginBottom:5}}>MILEAGE</label><input style={inputS} placeholder="25,000"/></div>
<div><label style={{fontSize:11,color:GRAY,display:"block",marginBottom:5}}>COLOR</label><input style={inputS} placeholder="Platinum Silver"/></div>
</div>
<div><label style={{fontSize:11,color:GRAY,display:"block",marginBottom:5}}>DESCRIPTION</label><textarea style={{...inputS,minHeight:120,resize:"vertical"}} placeholder="Describe your coach..."/></div>
<div style={{border:"2px dashed rgba(196,149,106,.15)",borderRadius:12,padding:40,textAlign:"center",cursor:"pointer"}}><Ico name="camera" size={36} color={GOLD}/><div style={{marginTop:10,fontSize:14,fontWeight:500}}>Upload Photos</div></div>
<button className="btn-gold" style={{width:"100%",padding:16,fontSize:15}}>Submit Free Listing</button>
</div></div></W>}
</div>}

{pg==="messages"&&<div className="fade-in">
{!user?<W style={{paddingTop:80,textAlign:"center"}}><Ico name="msg" size={44} color={GOLD}/><h2 style={{fontSize:22,fontWeight:600,marginTop:14}}>Sign in to view messages</h2><p style={{color:GRAY,marginTop:8,marginBottom:20}}>Create a free account to get started.</p><button className="btn-gold" onClick={()=>nav("auth",()=>setAuthMode("signup"))}>Create Free Account</button></W>
:<div style={{display:"flex",height:"calc(100vh - 64px)"}}>
<div style={{width:360,borderRight:"1px solid "+BORDER,overflow:"auto",flexShrink:0}}>
<div style={{padding:"20px 22px 14px",fontSize:20,fontWeight:600}}>Messages</div>
{myConvos.length===0&&<div style={{padding:36,textAlign:"center",color:GRAY,fontSize:13}}>No conversations yet.</div>}
{myConvos.map(cv=>{
const coach=COACHES.find(c=>c.id===cv.coachId);const lm=cv.messages[cv.messages.length-1];const active=cv.id===actC;const locked=isMySellerConvo(cv)&&!paid;const other=isMySellerConvo(cv)?cv.buyerName:cv.sellerName;
return(<div key={cv.id} onClick={()=>setActC(cv.id)} style={{display:"flex",gap:12,padding:"14px 22px",cursor:"pointer",background:active?DARK3:"transparent",borderLeft:active?"2px solid "+GOLD:"2px solid transparent"}}>
<div style={{width:42,height:42,borderRadius:"50%",background:DARK3,border:"1px solid "+BORDER,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,fontWeight:700,color:GOLD,flexShrink:0}}>{other[0]}</div>
<div style={{flex:1,minWidth:0}}>
<div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:600,fontSize:14}}>{other}</span>{lm&&<span style={{fontSize:10,color:GRAY}}>{lm.time}</span>}</div>
{coach&&<div style={{fontSize:11,color:GOLD,marginTop:2}}>{coach.year} {coach.conv} {coach.model}</div>}
{lm&&<div style={{fontSize:12,color:GRAY,marginTop:3,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",filter:locked?"blur(5px)":"none"}}>{locked?"New message from buyer":lm.text}</div>}
</div></div>);
})}
</div>
<div style={{flex:1,display:"flex",flexDirection:"column"}}>
{actConvo?(()=>{
const locked=isMySellerConvo(actConvo)&&!paid;const other=isMySellerConvo(actConvo)?actConvo.buyerName:actConvo.sellerName;
return(<>
<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 24px",borderBottom:"1px solid "+BORDER,flexShrink:0}}>
<div style={{display:"flex",alignItems:"center",gap:14}}>
<div style={{width:40,height:40,borderRadius:"50%",background:DARK3,border:"1px solid "+BORDER,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,fontWeight:700,color:GOLD}}>{other[0]}</div>
<div><div style={{fontSize:15,fontWeight:600}}>{other}</div>{actCoach&&<div style={{fontSize:12,color:GOLD,cursor:"pointer"}} onClick={()=>nav("detail",()=>setSel(actCoach))}>Re: {actCoach.year} {actCoach.conv} →</div>}</div>
</div></div>
<div ref={scrollRef} style={{flex:1,overflow:"auto",padding:24,display:"flex",flexDirection:"column",gap:12}}>
{actConvo.messages.map((m,i)=>{
const mine=(user.role==="buyer"&&m.from==="buyer")||(isMySellerConvo(actConvo)&&m.from==="seller");
return(<div key={i} style={{display:"flex",flexDirection:"column",alignItems:mine?"flex-end":"flex-start"}}>
{locked&&!mine?<div style={{maxWidth:"65%",padding:"12px 16px",borderRadius:"16px 16px 16px 4px",background:DARK3,fontSize:14,filter:"blur(8px)",userSelect:"none"}}>Hidden</div>
:<div style={{maxWidth:"65%",padding:"12px 16px",borderRadius:mine?"16px 16px 4px 16px":"16px 16px 16px 4px",background:mine?GOLD:DARK3,color:mine?DARK:CREAM,fontSize:14,lineHeight:1.5}}>{m.text}</div>}
<div style={{fontSize:10,color:GRAY,marginTop:4}}>{m.time}</div>
</div>);})}
</div>
{locked?<div style={{padding:22,borderTop:"1px solid "+BORDER,textAlign:"center"}}>
<div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,marginBottom:8}}><Ico name="lock" size={20} color={GOLD}/><span style={{fontSize:15,fontWeight:600}}>Buyer Messages Hidden</span></div>
<div style={{fontSize:13,color:GRAY,marginBottom:16}}>Pay $500 once to unlock forever.</div>
<button className="btn-gold" onClick={()=>setShowPay(true)}><Ico name="unlock" size={16} color={DARK}/> Unlock Forever — $500</button>
</div>
:<div style={{display:"flex",gap:12,padding:"16px 24px",borderTop:"1px solid "+BORDER}}>
<input style={{...inputS,flex:1}} placeholder="Type a message..." value={msgTxt} onChange={e=>setMsgTxt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doSend()}/>
<button className="btn-gold" style={{padding:"12px 24px"}} onClick={doSend}><Ico name="send" size={16} color={DARK}/> Send</button>
</div>}
</>);})():<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",color:GRAY}}>
<Ico name="msg" size={48} color="rgba(240,236,230,.08)"/><div style={{marginTop:16,fontSize:14}}>Select a conversation</div>
</div>}
</div></div>}
</div>}

{pg==="profile"&&user&&<W style={{paddingTop:48,paddingBottom:60}} className="fade-in">
<div style={{maxWidth:560}}>
<h2 style={{fontFamily:"'Playfair Display',serif",fontSize:32,fontWeight:700,marginBottom:28}}>Profile</h2>
<div style={{display:"flex",alignItems:"center",gap:18,padding:22,background:DARK2,borderRadius:14,border:"1px solid "+BORDER,marginBottom:22}}>
<div style={{width:56,height:56,borderRadius:"50%",background:"linear-gradient(135deg,"+GOLD+",#a07850)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontWeight:700,color:DARK}}>{user.name[0]}</div>
<div><div style={{fontSize:18,fontWeight:600}}>{user.name}</div><div style={{fontSize:13,color:GRAY}}>{user.email}</div><div style={{fontSize:12,color:GOLD,marginTop:3}}>{user.role==="buyer"?"Buyer":user.role==="seller"?"Seller":"Buyer & Seller"}{paid?" • Unlocked ✓":""}</div></div>
</div>
{[["My Listings","Manage your coach listings"],["Saved Coaches","Bookmarked coaches"],["Settings","Email, password, notifications"]].map(([t,d])=>(<div key={t} style={{padding:"16px 22px",background:DARK2,borderRadius:10,border:"1px solid "+BORDER,marginBottom:10,cursor:"pointer"}}><div style={{fontSize:15,fontWeight:500}}>{t}</div><div style={{fontSize:12,color:GRAY,marginTop:2}}>{d}</div></div>))}
<button className="btn-outline" style={{width:"100%",marginTop:22,color:"#c46a6a",borderColor:"rgba(196,106,106,.2)"}} onClick={()=>{setUser(null);nav("home");}}><Ico name="logout" size={16} color="#c46a6a"/> Sign Out</button>
</div></W>}

</div>

{showPay&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",backdropFilter:"blur(16px)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={()=>!payDone&&setShowPay(false)}>
<div style={{width:440,background:DARK2,borderRadius:20,border:"1px solid rgba(196,149,106,.15)",padding:44}} onClick={e=>e.stopPropagation()}>
{payDone?<div style={{textAlign:"center"}}><div style={{width:64,height:64,borderRadius:"50%",background:"rgba(106,196,140,.1)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 22px"}}><Ico name="check" size={32} color="#6ac48c"/></div><h3 style={{fontSize:22,fontWeight:700,marginBottom:8}}>Messaging Unlocked!</h3><p style={{color:GRAY,fontSize:14}}>Reply to all buyer messages — past and future.</p></div>:<>
<div style={{textAlign:"center",marginBottom:24}}>
<div style={{width:52,height:52,borderRadius:"50%",background:"rgba(196,149,106,.08)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px"}}><Ico name="lock" size={26} color={GOLD}/></div>
<h3 style={{fontSize:22,fontWeight:700,marginBottom:8}}>A Real Buyer Is Interested</h3>
<p style={{color:GRAY,fontSize:14}}>Pay a one-time <span style={{color:GOLD,fontWeight:700}}>$500</span> to unlock messaging <span style={{color:CREAM,fontWeight:600}}>forever</span>.</p>
</div>
<div style={{background:DARK3,borderRadius:12,padding:18,marginBottom:22}}>
<div style={{fontSize:10,color:GOLD,letterSpacing:".1em",fontWeight:600,marginBottom:12}}>WHAT YOU GET — FOREVER</div>
{["Read all buyer messages","Reply to every buyer","Unlimited conversations","Contact info revealed","Never pay again"].map(f=>(<div key={f} style={{display:"flex",gap:8,alignItems:"center",fontSize:13,color:CREAM,marginBottom:8}}><Ico name="check" size={14} color={GOLD}/> {f}</div>))}
</div>
<button className="btn-gold" style={{width:"100%",padding:16,fontSize:15}} onClick={handlePay}><Ico name="unlock" size={18} color={DARK}/> Unlock Forever — $500</button>
<button className="btn-outline" style={{width:"100%",marginTop:10,fontSize:12,color:GRAY}} onClick={()=>setShowPay(false)}>Maybe Later</button>
</>}</div></div>}

</div>);
}
ReactDOM.render(React.createElement(App),document.getElementById("root"));
</script>
</body>
</html>
