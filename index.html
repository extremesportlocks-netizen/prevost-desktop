<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#c4956a;--dark:#070707;--dark2:#0f0f0f;--dark3:#161616;--cream:#f0ece6;--gray:rgba(240,236,230,0.5);--border:rgba(240,236,230,0.08);--max:1320px}
html{scroll-behavior:smooth}
body{background:var(--dark);color:var(--cream);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--gold);color:var(--dark)}
input,select,textarea,button{font-family:inherit}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--dark2)}
::-webkit-scrollbar-thumb{background:rgba(196,149,106,0.3);border-radius:3px}
a{color:inherit;text-decoration:none}
.fade-in{animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{border-radius:14px;background:var(--dark2);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:transform .35s,border-color .35s,box-shadow .35s}
.card:hover{transform:translateY(-6px);border-color:rgba(196,149,106,0.25);box-shadow:0 20px 60px rgba(0,0,0,0.4)}
.card:hover .card-img{transform:scale(1.05)}
.card-img{transition:transform .7s ease}
.btn-gold{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:16px 32px;background:var(--gold);color:var(--dark);border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:all .3s;letter-spacing:.02em}
.btn-gold:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 8px 30px rgba(196,149,106,0.3)}
.btn-outline{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:16px 32px;background:transparent;color:var(--cream);border:1px solid rgba(240,236,230,0.15);border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;transition:all .3s}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
</style>
</head>

/* ─── Badge ─── */
function Badge({tag}){
  if(!tag)return null;
  const m={"just-listed":{bg:"rgba(106,196,140,.15)",c:"#6ac48c"},featured:{bg:"rgba(196,149,106,.15)",c:GOLD},"price-drop":{bg:"rgba(196,106,106,.15)",c:"#c46a6a"}};
  const s=m[tag]||{bg:"rgba(196,149,106,.1)",c:GOLD};
  return <span style={{display:"inline-flex",padding:"5px 12px",borderRadius:6,fontSize:10,fontWeight:600,letterSpacing:".08em",textTransform:"uppercase",background:s.bg,color:s.c}}>{tag.replace(/-/g," ")}</span>;
}

/* ─── Coach Card ─── */
function CoachCard({coach:c,onClick}){
  return(
    <div className="card" onClick={onClick}>
      <div style={{position:"relative",overflow:"hidden"}}>
        <div className="card-img"><CoachSVG index={c.id-1}/></div>
        {c.tag&&<div style={{position:"absolute",top:14,left:14,zIndex:2}}><Badge tag={c.tag}/></div>}
        <div style={{position:"absolute",bottom:0,left:0,right:0,padding:"28px 14px 12px",background:"linear-gradient(to top,rgba(0,0,0,.75),transparent)",display:"flex",gap:8,flexWrap:"wrap",zIndex:2}}>
          {[c.mi+" mi",c.eng,c.len].map(t=><span key={t} style={{fontSize:11,padding:"4px 10px",borderRadius:5,background:"rgba(0,0,0,.55)",color:"rgba(255,255,255,.85)",backdropFilter:"blur(4px)"}}>{t}</span>)}

      <div style={{padding:"16px 20px 20px"}}>
        <div style={{fontSize:11,color:GOLD,letterSpacing:".06em",fontWeight:600,marginBottom:5}}>{c.conv} {c.num}</div>
        <div style={{fontSize:17,fontWeight:600,marginBottom:10}}>{c.year} Prevost {c.model}</div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>

/* ═══════════════════ MAIN APP ═══════════════════ */
function App(){
  const [pg,setPg]=useState("home");
  const [user,setUser]=useState(null);
  const [authMode,setAuthMode]=useState("login");
  const [authRole,setAuthRole]=useState("buyer");
  const [sel,setSel]=useState(null);
  const [convos,setConvos]=useState(MSGS_INIT);
  const [actC,setActC]=useState(null);
  const [flt,setFlt]=useState({search:"",converter:"",price:"",slides:""});
  const [hIdx,setHIdx]=useState(0);
  const [showPay,setShowPay]=useState(false);
  const [payDone,setPayDone]=useState(false);
  const [msgTxt,setMsgTxt]=useState("");
  const scrollRef=useRef(null);

  useEffect(()=>{const t=setInterval(()=>setHIdx(i=>(i+1)%4),5000);return()=>clearInterval(t);},[]);

  const nav=useCallback((p,fn)=>{setPg(p);if(fn)fn();window.scrollTo({top:0,behavior:"smooth"});},[]);

  const filtered=COACHES.filter(c=>{
    const s=flt.search.toLowerCase(),t=(c.year+" "+c.conv+" "+c.model+" "+c.slides+" "+c.num).toLowerCase();
    if(s&&!t.includes(s))return false;
    if(flt.converter&&c.conv!==flt.converter)return false;
    if(flt.slides&&c.slides!==flt.slides)return false;
    if(flt.price){const p=+flt.price;if(p===1&&c.price>=1e6)return false;if(p===2&&(c.price<1e6||c.price>=2e6))return false;if(p===3&&c.price<2e6)return false;}
    return true;
  });

  const isSeller=user&&(user.role==="seller"||user.role==="both");
  const isBuyer=user&&(user.role==="buyer"||user.role==="both");
  const paid=user?.paid;
  const isMySellerConvo=cv=>isSeller&&cv.sellerId===user.odId;
  const canRead=cv=>!isMySellerConvo(cv)||!!paid;
  const myConvos=user?convos.filter(cv=>(isBuyer&&cv.buyerId===user.odId)||(isSeller&&cv.sellerId===user.odId)):[];
  const lockedCount=myConvos.filter(cv=>isMySellerConvo(cv)&&!paid&&cv.messages.length>0).length;
  const sendMsg=(id,txt)=>setConvos(p=>p.map(c=>c.id===id?{...c,messages:[...c.messages,{text:txt,time:"Just now",from:isMySellerConvo(c)?"seller":"buyer"}]}:c));
  const startConvo=coach=>{
    const ex=convos.find(c=>c.coachId===coach.id&&c.buyerId===(user?.odId||"b_demo"));
    if(ex){setActC(ex.id);}else{
      const nc={id:Date.now(),coachId:coach.id,buyerId:user?.odId||"b_demo",sellerId:coach.sellerId,sellerName:coach.seller,buyerName:user?.name||"You",messages:[]};
      setConvos(p=>[...p,nc]);setActC(nc.id);
    }
    nav("messages");
  };
  const handlePay=()=>{setPayDone(true);setTimeout(()=>{setUser(p=>({...p,paid:true}));setShowPay(false);setPayDone(false);},2000);};
  const actConvo=convos.find(c=>c.id===actC);
  const actCoach=actConvo?COACHES.find(c=>c.id===actConvo.coachId):null;
  useEffect(()=>{if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight;},[actConvo?.messages?.length]);
  const doSend=()=>{if(!msgTxt.trim()||!actConvo)return;sendMsg(actConvo.id,msgTxt.trim());setMsgTxt("");};

  const W=({children,style})=><div style={{maxWidth:1320,margin:"0 auto",padding:"0 60px",...style}}>{children}</div>;

  /* ─── RENDER ─── */
  return(
  <div>

    {/* ════ NAVBAR ════ */}
    <nav style={{position:"fixed",top:0,left:0,right:0,height:72,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(7,7,7,.92)",backdropFilter:"blur(24px)",borderBottom:"1px solid rgba(196,149,106,.1)",zIndex:200}}>
      <W style={{display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%"}}>
        <div style={{display:"flex",alignItems:"center",gap:14,cursor:"pointer"}} onClick={()=>nav("home")}>
          <div style={{width:10,height:10,background:GOLD,transform:"rotate(45deg)"}}/>
          <span style={{fontSize:24,fontWeight:700,letterSpacing:".03em"}}>PREVOST<span style={{color:GOLD}}>STUFF</span></span>
        </div>

            </div>
            <div><label style={{fontSize:12,color:GRAY,display:"block",marginBottom:6}}>CONVERTER</label><select style={selectS}><option value="">Select converter...</option>{["Marathon","Liberty","Millennium","Emerald","Epic","Featherlite","Loki","Other"].map(c=><option key={c}>{c}</option>)}</select></div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
              <div><label style={{fontSize:12,color:GRAY,display:"block",marginBottom:6}}>ASKING PRICE</label><input style={inputS} placeholder="$1,500,000"/></div>
              <div><label style={{fontSize:12,color:GRAY,display:"block",marginBottom:6}}>MILEAGE</label><input style={inputS} placeholder="25,000"/></div>
            </div>
            <div><label style={{fontSize:12,color:GRAY,display:"block",marginBottom:6}}>DESCRIPTION</label><textarea style={{...inputS,minHeight:130,resize:"vertical"}} placeholder="Describe your coach..."/></div>
            <div style={{border:"2px dashed rgba(196,149,106,.25)",borderRadius:16,padding:48,textAlign:"center",cursor:"pointer"}}><Ico name="camera" size={40} color={GOLD}/><div style={{marginTop:12,fontSize:15,fontWeight:500}}>Upload Photos</div><div style={{fontSize:12,color:GRAY,marginTop:6}}>Up to 30 photos</div></div>
            <button className="btn-gold" style={{width:"100%",padding:18,fontSize:16}}>Submit Free Listing</button>
          </div>
        </div>
      </W>}
    </div>}

    {/* ════ MESSAGES ════ */}
    {pg==="messages"&&<div className="fade-in">
      {!user?<W style={{paddingTop:80,textAlign:"center"}}><Ico name="msg" size={48} color={GOLD}/><h2 style={{fontSize:24,fontWeight:600,marginTop:16}}>Sign in to view messages</h2><p style={{color:GRAY,marginTop:8,marginBottom:24}}>Create a free account to get started.</p><button className="btn-gold" onClick={()=>nav("auth",()=>setAuthMode("signup"))}>Create Free Account</button></W>
      :<div style={{display:"flex",height:"calc(100vh - 72px)"}}>
        <div style={{width:380,borderRight:"1px solid "+BORDER,overflow:"auto",flexShrink:0}}>
          <div style={{padding:"24px 24px 16px",fontSize:22,fontWeight:600}}>Messages</div>
          {myConvos.length===0&&<div style={{padding:40,textAlign:"center",color:GRAY,fontSize:14}}>No conversations yet.</div>}
          {myConvos.map(cv=>{
            const coach=COACHES.find(c=>c.id===cv.coachId);
            const lm=cv.messages[cv.messages.length-1];
            const active=cv.id===actC;
            const locked=isMySellerConvo(cv)&&!paid;
            const other=isMySellerConvo(cv)?cv.buyerName:cv.sellerName;
            return(
              <div key={cv.id} onClick={()=>setActC(cv.id)} style={{display:"flex",gap:14,padding:"16px 24px",cursor:"pointer",background:active?DARK3:"transparent",borderLeft:active?"3px solid "+GOLD:"3px solid transparent",transition:"all .2s"}}>
                <div style={{width:46,height:46,borderRadius:"50%",background:DARK3,border:"1px solid "+BORDER,display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,fontWeight:700,color:GOLD,flexShrink:0}}>{other[0]}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:600}}>{other}</span>{lm&&<span style={{fontSize:11,color:GRAY}}>{lm.time}</span>}</div>
                  {coach&&<div style={{fontSize:12,color:GOLD,marginTop:2}}>{coach.year} {coach.conv} {coach.model}</div>}
                  {lm&&<div style={{fontSize:13,color:GRAY,marginTop:4,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",filter:locked?"blur(5px)":"none"}}>{locked?"New message from buyer":lm.text}</div>}
                  {locked&&<span style={{display:"inline-flex",padding:"3px 8px",borderRadius:5,fontSize:9,fontWeight:600,letterSpacing:".06em",background:"rgba(106,196,140,.15)",color:"#6ac48c",marginTop:6}}>NEW BUYER MESSAGE</span>}
                </div>
              </div>
            );
          })}
        </div>
        <div style={{flex:1,display:"flex",flexDirection:"column"}}>
          {actConvo?(()=>{
            const locked=isMySellerConvo(actConvo)&&!paid;
            const other=isMySellerConvo(actConvo)?actConvo.buyerName:actConvo.sellerName;
            return(<>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"18px 28px",borderBottom:"1px solid "+BORDER,flexShrink:0}}>
                <div style={{display:"flex",alignItems:"center",gap:16}}>
                  <div style={{width:44,height:44,borderRadius:"50%",background:DARK3,border:"1px solid "+BORDER,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,fontWeight:700,color:GOLD}}>{other[0]}</div>
                  <div><div style={{fontSize:17,fontWeight:600}}>{other}</div>{actCoach&&<div style={{fontSize:13,color:GOLD,cursor:"pointer"}} onClick={()=>nav("detail",()=>setSel(actCoach))}>Re: {actCoach.year} {actCoach.conv} →</div>}</div>
                </div>
                {locked&&<span style={{padding:"6px 14px",borderRadius:6,fontSize:11,fontWeight:600,background:"rgba(196,149,106,.12)",color:GOLD}}><Ico name="lock" size={12} color={GOLD}/> LOCKED</span>}
              </div>
              <div ref={scrollRef} style={{flex:1,overflow:"auto",padding:28,display:"flex",flexDirection:"column",gap:14}}>
                {actConvo.messages.map((m,i)=>{
                  const mine=(user.role==="buyer"&&m.from==="buyer")||(isMySellerConvo(actConvo)&&m.from==="seller");
                  return(<div key={i} style={{display:"flex",flexDirection:"column",alignItems:mine?"flex-end":"flex-start"}}>
                    {locked&&!mine?<div style={{maxWidth:"70%",padding:"14px 18px",borderRadius:"18px 18px 18px 4px",background:DARK3,color:CREAM,fontSize:15,lineHeight:1.5,filter:"blur(8px)",userSelect:"none",pointerEvents:"none"}}>This message is hidden</div>
                    :<div style={{maxWidth:"70%",padding:"14px 18px",borderRadius:mine?"18px 18px 4px 18px":"18px 18px 18px 4px",background:mine?GOLD:DARK3,color:mine?DARK:CREAM,fontSize:15,lineHeight:1.5}}>{m.text}</div>}
                    <div style={{fontSize:11,color:GRAY,marginTop:5}}>{m.time}</div>
                  </div>);
                })}
              </div>
              {locked?<div style={{padding:24,borderTop:"1px solid "+BORDER,textAlign:"center",background:"rgba(196,149,106,.03)"}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10,marginBottom:10}}><Ico name="lock" size={22} color={GOLD}/><span style={{fontSize:17,fontWeight:600}}>Buyer Messages Hidden</span></div>
                <div style={{fontSize:14,color:GRAY,marginBottom:18,maxWidth:420,margin:"0 auto 18px"}}>Pay $500 once to read and reply to all messages — forever.</div>
                <button className="btn-gold" style={{padding:"14px 36px"}} onClick={()=>setShowPay(true)}><Ico name="unlock" size={18} color={DARK}/> Unlock Forever — $500</button>
              </div>
              :<div style={{display:"flex",gap:14,padding:"18px 28px",borderTop:"1px solid "+BORDER}}>
                <input style={{...inputS,flex:1}} placeholder="Type a message..." value={msgTxt} onChange={e=>setMsgTxt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doSend()}/>
                <button className="btn-gold" style={{padding:"14px 28px"}} onClick={doSend}><Ico name="send" size={18} color={DARK}/> Send</button>
              </div>}
            </>);
          })():<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",color:GRAY}}>
            <Ico name="msg" size={56} color="rgba(240,236,230,.1)"/>
            <div style={{marginTop:20,fontSize:16}}>Select a conversation</div>
          </div>}
        </div>
      </div>}
    </div>}

    {/* ════ PROFILE ════ */}
    {pg==="profile"&&user&&<W style={{paddingTop:48,paddingBottom:60}} className="fade-in">
      <div style={{maxWidth:560}}>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:36,fontWeight:700,marginBottom:32}}>Profile</h2>
        <div style={{display:"flex",alignItems:"center",gap:20,padding:24,background:DARK2,borderRadius:16,border:"1px solid "+BORDER,marginBottom:24}}>
          <div style={{width:64,height:64,borderRadius:"50%",background:`linear-gradient(135deg,${GOLD},#a07850)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,fontWeight:700,color:DARK}}>{user.name[0]}</div>
          <div>
            <div style={{fontSize:20,fontWeight:600}}>{user.name}</div>
            <div style={{fontSize:14,color:GRAY}}>{user.email}</div>
            <div style={{fontSize:13,color:GOLD,marginTop:4}}>{user.role==="buyer"?"Buyer":user.role==="seller"?"Seller":"Buyer & Seller"}{paid?" • Messaging Unlocked ✓":""}</div>
          </div>
        </div>
        {isSeller&&!paid&&<div style={{padding:24,background:"rgba(196,149,106,.06)",borderRadius:14,border:"1px solid rgba(196,149,106,.15)",marginBottom:20}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}><Ico name="lock" size={20} color={GOLD}/><span style={{fontSize:16,fontWeight:600}}>Messaging Locked</span></div>
          <div style={{fontSize:14,color:GRAY,lineHeight:1.6,marginBottom:14}}>Your listing is live. When a buyer contacts you, pay $500 once to unlock messaging forever.</div>
          {lockedCount>0&&<button className="btn-gold" style={{width:"100%"}} onClick={()=>setShowPay(true)}>Unlock Messaging — $500 (One‑Time)</button>}
        </div>}
        {isSeller&&paid&&<div style={{padding:24,background:"rgba(106,196,140,.06)",borderRadius:14,border:"1px solid rgba(106,196,140,.15)",marginBottom:20}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}><Ico name="unlock" size={20} color="#6ac48c"/><span style={{fontSize:16,fontWeight:600,color:"#6ac48c"}}>Messaging Unlocked Forever</span></div>
          <div style={{fontSize:14,color:GRAY,marginTop:6}}>You can read and reply to all buyer messages. No further charges.</div>
        </div>}
        {[["My Listings","Manage your coach listings"],["Saved Coaches","Bookmarked coaches"],["Settings","Email, password, notifications"]].map(([t,d])=>(
          <div key={t} style={{padding:"18px 24px",background:DARK2,borderRadius:12,border:"1px solid "+BORDER,marginBottom:12,cursor:"pointer"}}><div style={{fontSize:16,fontWeight:500}}>{t}</div><div style={{fontSize:13,color:GRAY,marginTop:3}}>{d}</div></div>
        ))}
        <button className="btn-outline" style={{width:"100%",marginTop:24,color:"#c46a6a",borderColor:"rgba(196,106,106,.25)"}} onClick={()=>{setUser(null);nav("home");}}><Ico name="logout" size={18} color="#c46a6a"/> Sign Out</button>
      </div>
    </W>}

    </div>

    {/* ── PAYWALL MODAL ── */}
    {showPay&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.8)",backdropFilter:"blur(12px)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={()=>!payDone&&setShowPay(false)}>
      <div style={{width:460,background:DARK2,borderRadius:24,border:"1px solid rgba(196,149,106,.2)",padding:48}} onClick={e=>e.stopPropagation()}>
        {payDone?<div style={{textAlign:"center",padding:"20px 0"}}>
          <div style={{width:72,height:72,borderRadius:"50%",background:"rgba(106,196,140,.12)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 24px"}}><Ico name="check" size={36} color="#6ac48c"/></div>
          <h3 style={{fontSize:24,fontWeight:700,marginBottom:10}}>Messaging Unlocked Forever!</h3>
          <p style={{color:GRAY,fontSize:15}}>You can now read and reply to all buyer messages — past and future.</p>
        </div>:<>
          <div style={{textAlign:"center",marginBottom:28}}>
            <div style={{width:60,height:60,borderRadius:"50%",background:"rgba(196,149,106,.1)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 18px"}}><Ico name="lock" size={30} color={GOLD}/></div>
            <h3 style={{fontSize:24,fontWeight:700,marginBottom:10}}>A Real Buyer Is Interested</h3>
            <p style={{color:GRAY,fontSize:15,lineHeight:1.6}}>Pay a one‑time <span style={{color:GOLD,fontWeight:700}}>$500</span> to unlock messaging <span style={{color:CREAM,fontWeight:600}}>forever</span>.</p>
          </div>
          <div style={{background:DARK3,borderRadius:14,padding:20,marginBottom:24}}>
            <div style={{fontSize:12,color:GOLD,letterSpacing:".08em",fontWeight:600,marginBottom:14}}>WHAT YOU GET — FOREVER</div>
            {["Read all buyer messages — past and future","Reply directly to every interested buyer","Unlimited conversations on all listings","Buyer contact information revealed","Never pay again — one‑time fee only"].map(f=>(
              <div key={f} style={{display:"flex",gap:10,alignItems:"center",fontSize:14,color:CREAM,marginBottom:10}}><Ico name="check" size={16} color={GOLD}/> {f}</div>
            ))}
          </div>
          <div style={{textAlign:"center",marginBottom:18,fontSize:13,color:GRAY}}>$500 once — that's 0.03% of a $1.5M coach.</div>
          <button className="btn-gold" style={{width:"100%",padding:18,fontSize:17}} onClick={handlePay}><Ico name="unlock" size={20} color={DARK}/> Unlock Forever — $500</button>
          <button className="btn-outline" style={{width:"100%",marginTop:12,fontSize:13,color:GRAY,borderColor:"rgba(240,236,230,.08)"}} onClick={()=>setShowPay(false)}>Maybe Later</button>
        </>}
      </div>
    </div>}

  </div>);
}

ReactDOM.render(React.createElement(App),document.getElementById("root"));
</script>
</body>
</html>
